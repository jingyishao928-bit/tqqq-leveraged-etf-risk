project:
  name: rmsc5003-topic10-leveraged-etf
  trading_days_per_year: 252
  random_seed: 42

products:
  benchmark: QQQ
  bull_leveraged: TQQQ
  bear_leveraged: SQQQ
  bull_beta: 3.0
  bear_beta: -3.0

data:
  start_date: "2019-01-01"
  end_date: null
  price_field: adjusted_close
  processed_file: data/processed/clean_returns.csv

part1:
  raw_start_date: "2010-02-11"
  analysis_start_date: "2019-01-01"
  analysis_end_date: "2026-11-20"
  leverage: 3.0
  prices_file: data/processed/part1_clean_prices.csv
  returns_file: data/processed/part1_clean_returns.csv
  output_dir: outputs/part1

risk:
  confidence_levels: [0.95, 0.99]
  horizon_days: [1, 10, 21]
  losses_are_positive: true

simulation:
  paths: 10000
  nav_floor: 0.0

backtest:
  estimation_window: 500
  horizon_days: 1
